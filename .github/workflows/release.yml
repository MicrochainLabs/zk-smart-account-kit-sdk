name: Release

# Runs after CI succeeds on a push to main. Creates a GitHub Release tagged
# v<package.json version> unless that tag already exists, and publishes the
# package to npm unless that version is already on the registry.
# Requires the NPM_TOKEN repository secret (an npm automation token).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release & publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Build
        if: steps.version.outputs.release == 'true' || steps.version.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # CycloneDX SBOM of what a consumer installs (the packed tarball + its production dependencies).
      - name: Generate SBOM
        if: steps.version.outputs.release == 'true'
        run: |
          work=$(mktemp -d)
          npm pack --pack-destination "$work" >/dev/null
          (cd "$work" && echo '{"name":"sbom","version":"1.0.0","private":true}' > package.json \
            && npm install --no-audit --no-fund ./*.tgz >/dev/null \
            && npm sbom --sbom-format cyclonedx --omit dev > "$GITHUB_WORKSPACE/sbom.cdx.json")

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: |
          tag_flag=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then tag_flag=(--tag next); fi
          npm publish --provenance --access public "${tag_flag[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        run: |
          args=(--target "$SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          gh release create "${{ steps.version.outputs.tag }}" "${args[@]}" sbom.cdx.json
