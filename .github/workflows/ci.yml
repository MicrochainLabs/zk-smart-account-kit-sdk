name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, audit, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dependency audit (production dependencies)
        run: pnpm audit:deps

      - name: API docs build (fails on broken doc comments)
        run: pnpm docs:api

  test:
    name: Tests + coverage (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Anvil for the on-chain tests, which verify SDK proofs with the real Microchain contracts.
      - uses: foundry-rs/foundry-toolchain@v1

      # Unit tests, end-to-end proof tests (real Noir circuits + Barretenberg) and on-chain tests
      # (Anvil + generated Honk verifiers, ZK signer factory, Nexus validator), with coverage thresholds.
      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build & package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (ESM + CJS)
        run: pnpm build

      - name: Package lint (publint + are-the-types-wrong)
        run: pnpm lint:package

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke:
    name: Install & import smoke test (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Installs the packed tarball into an empty project, as a consumer would, and loads it from ESM and CJS.
      - name: Smoke test
        run: node scripts/smoke.mjs

  integration:
    name: Integration — real Safe, Nexus and EntryPoint v0.7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Builds third-party contracts from source (microchain-zk-signers, Nexus and their dependencies), so it
    # depends on those repositories and the network. Informational until its inputs are pinned by a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: MicrochainLabs/microchain-zk-signers
          path: microchain-zk-signers
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Install microchain-zk-signers dependencies (Solidity sources)
        run: pnpm install --frozen-lockfile
        working-directory: microchain-zk-signers

      - name: Build contracts (Safe, Nexus, EntryPoint, ZK validator)
        run: node scripts/build-integration-contracts.mjs microchain-zk-signers "$RUNNER_TEMP/zk-int-out"

      - name: Integration tests
        run: pnpm test:integration
        env:
          ZK_SIGNERS_OUT: ${{ runner.temp }}/zk-int-out

  compat-bb-latest:
    name: Compatibility — latest stable @aztec/bb.js (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install latest stable @aztec/bb.js
        run: pnpm add -D @aztec/bb.js@latest

      - name: End-to-end proof tests
        run: pnpm test:e2e
