version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: develop
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The circuits are compiled with these exact versions; upgrade them together with the circuits.
      - dependency-name: "@aztec/bb.js"
      - dependency-name: "@noir-lang/noir_js"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    labels: [dependencies]
